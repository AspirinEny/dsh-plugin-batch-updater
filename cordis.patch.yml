# Bundle patch: the row loads this package's index.js as the Host half (a plain
# Cordis plugin) and its ./client.js as the browser half, through `dsh.client`.
- insert:
    - id: dsh-batch-updater
      name: 'dsh-batch-updater'
      config:
        intervalMinutes: 360
        autoApply: false
        includePrerelease: false
